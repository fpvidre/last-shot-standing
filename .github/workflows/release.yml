name: Build and release

# Change "version" in package.json and push to main: this builds the Mac and
# Windows apps and publishes them as a GitHub Release (for example v1.0.1).
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Not code-signed yet: no Apple Developer certificate on this repo.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
